<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>💖 来自她的桌面</title>
<style>
  /* ===== 全局重置 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    user-select: none; -webkit-user-select: none;
    background: linear-gradient(160deg, #fbc2eb 0%, #a6c1ee 50%, #c3ccea 100%);
  }

  /* ===== 背景粒子 Canvas ===== */
  #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

  /* ===== 主容器 ===== */
  .container {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
  }

  /* ===== 跳动爱心 ===== */
  .heart-container {
    position: relative; margin-bottom: 20px;
  }
  .big-heart {
    font-size: 80px;
    animation: heartbeat 1.2s ease-in-out infinite;
    filter: drop-shadow(0 4px 15px rgba(255,100,150,0.5));
    display: inline-block;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    14% { transform: scale(1.15); }
    28% { transform: scale(1); }
    42% { transform: scale(1.12); }
    70% { transform: scale(1); }
  }

  /* ===== 文案 ===== */
  .message {
    text-align: center; color: #6b4a5e;
    font-size: 17px; font-weight: 600;
    line-height: 1.6; margin-bottom: 8px;
    text-shadow: 0 1px 3px rgba(255,255,255,0.6);
    padding: 0 10px;
  }
  .message .highlight { color: #e84393; font-size: 19px; }

  /* ===== 快捷回复按钮 ===== */
  .quick-replies {
    display: flex; flex-direction: column; gap: 12px;
    width: 100%; max-width: 340px; margin-top: 24px;
  }
  .reply-btn {
    display: flex; align-items: center; justify-content: center;
    padding: 14px 20px; border-radius: 28px;
    font-size: 15px; font-weight: 500;
    border: 2px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.35);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #5a3a4a; cursor: pointer;
    transition: all 0.25s ease;
    animation: slideIn 0.5s ease backwards;
  }
  .reply-btn:nth-child(1) { animation-delay: 0.1s; }
  .reply-btn:nth-child(2) { animation-delay: 0.2s; }
  .reply-btn:nth-child(3) { animation-delay: 0.3s; }
  .reply-btn:nth-child(4) { animation-delay: 0.4s; }
  .reply-btn:active {
    transform: scale(0.95);
    background: rgba(255,255,255,0.55);
    border-color: rgba(255,150,200,0.8);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== 自定义输入区 ===== */
  .input-area {
    display: flex; gap: 10px; margin-top: 20px;
    width: 100%; max-width: 340px;
  }
  .text-input {
    flex: 1; padding: 14px 18px; border-radius: 28px;
    border: 2px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.4);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; color: #5a3a4a; outline: none;
    transition: border-color 0.25s;
  }
  .text-input::placeholder { color: rgba(90,58,74,0.45); }
  .text-input:focus { border-color: rgba(255,150,200,0.8); }
  .send-btn {
    padding: 14px 22px; border-radius: 28px; border: none;
    background: linear-gradient(135deg, #fd79a8, #e84393);
    color: white; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all 0.25s;
    box-shadow: 0 4px 15px rgba(232,67,147,0.35);
  }
  .send-btn:active { transform: scale(0.92); }

  /* ===== 发送反馈动画 ===== */
  .feedback {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 100;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(20px);
    padding: 30px 40px; border-radius: 24px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(232,67,147,0.3);
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
  }
  .feedback.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
  .feedback .emoji { font-size: 48px; margin-bottom: 10px; display: block; }
  .feedback .text { color: #e84393; font-size: 16px; font-weight: 600; }

  /* ===== 非通知入口提示 ===== */
  .notice {
    position: fixed; inset: 0; z-index: 50;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: linear-gradient(160deg, #fbc2eb 0%, #a6c1ee 50%, #c3ccea 100%);
    text-align: center; padding: 40px;
  }
  .notice-emoji {
    font-size: 64px; margin-bottom: 18px;
    animation: heartbeat 1.5s ease-in-out infinite;
  }
  .notice-text {
    color: #6b4a5e; font-size: 17px; font-weight: 600; line-height: 1.9;
  }
  .notice-text span { font-size: 14px; font-weight: 400; opacity: .75; }

  /* ===== 禁止滚动 ===== */
  body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="container">
  <div class="heart-container">
    <span class="big-heart">💖</span>
  </div>

  <div class="message">
    <span class="highlight">TA</span>刚刚戳了戳桌宠<br>
    我想你啦！💖
  </div>

  <div class="quick-replies">
    <button class="reply-btn" data-msg="🥰 摸摸头，我也超级想你！">🥰 摸摸头，我也超级想你！</button>
    <button class="reply-btn" data-msg="🏃 忙完手头这阵马上陪你！">🏃 忙完手头这阵马上陪你！</button>
    <button class="reply-btn" data-msg="🤗 给你一个大大的隔空拥抱！">🤗 给你一个大大的隔空拥抱！</button>
    <button class="reply-btn" data-msg="🧋 今晚带你去吃好吃的！">🧋 今晚带你去吃好吃的！</button>
  </div>

  <div class="input-area">
    <input type="text" class="text-input" id="customInput" placeholder="或者写一句你想对她说的话..." maxlength="200">
    <button class="send-btn" id="sendBtn">发送</button>
  </div>
</div>

<div class="feedback" id="feedback">
  <span class="emoji">✨</span>
  <span class="text">心意已传回 TA 的电脑桌面~</span>
</div>

<div class="notice" id="notice">
  <div class="notice-emoji">💌</div>
  <div class="notice-text">
    请从手机通知里点开这个页面哦～<br>
    <span>这样才能把心意送回 TA 的桌面</span>
  </div>
</div>

<script>
// ====== 配置 ======
// 页面本身不含任何密钥！回复目标由手机通知带来的 ?reply= 参数决定。
// 通知是"你的桌宠"发的：它把自己的收件箱 topic 塞进了跳转链接，
// 所以 topic 只存在于你和 TA 各自的电脑上，不会出现在这个公开页面里。
const params = new URLSearchParams(location.search);
const REPLY_TOPIC = (params.get('reply') || '').trim();
const NTFY_URL = REPLY_TOPIC ? ('https://ntfy.sh/' + REPLY_TOPIC) : null;

// 不是从通知点进来的（直接输网址/被人转发）→ 不给发消息，避免打扰对方
if (!NTFY_URL) {
  document.getElementById('notice').style.display = 'flex';
}

// ====== 背景粒子 (飘落樱花/爱心) ======
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const particles = [];
const particleTypes = ['🌸', '💗', '✨', '🌸', '🌸'];
const MAX_PARTICLES = 30;

function spawnParticle(x, y) {
  if (particles.length >= MAX_PARTICLES) return;
  particles.push({
    x: x !== undefined ? x : Math.random() * canvas.width,
    y: y !== undefined ? y : -30,
    vx: (Math.random() - 0.5) * 0.8,
    vy: 0.5 + Math.random() * 1.2,
    size: 14 + Math.random() * 16,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.03,
    type: particleTypes[Math.floor(Math.random() * particleTypes.length)],
    opacity: 0.4 + Math.random() * 0.4,
    life: 1,
    burst: false,
  });
}

// 点击爆裂爱心
function burstHearts(x, y) {
  for (let i = 0; i < 12; i++) {
    const angle = (i / 12) * Math.PI * 2;
    const speed = 2 + Math.random() * 3;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1,
      size: 16 + Math.random() * 12,
      rotation: 0, rotSpeed: (Math.random() - 0.5) * 0.1,
      type: ['💖', '💗', '💕', '❤️'][Math.floor(Math.random() * 4)],
      opacity: 1, life: 1, burst: true,
      gravity: 0.08,
    });
  }
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 自动生成飘落粒子
  if (Math.random() < 0.08 && particles.filter(p => !p.burst).length < MAX_PARTICLES) {
    spawnParticle();
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.rotation += p.rotSpeed;

    if (p.burst) {
      p.vy += p.gravity;
      p.life -= 0.02;
      p.opacity = Math.max(0, p.life);
      if (p.life <= 0) { particles.splice(i, 1); continue; }
    } else {
      // 飘落粒子横向摆动
      p.vx += (Math.random() - 0.5) * 0.05;
      p.vx = Math.max(-1.5, Math.min(1.5, p.vx));
      if (p.y > canvas.height + 30) { particles.splice(i, 1); continue; }
    }

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);
    ctx.globalAlpha = p.opacity;
    ctx.font = p.size + 'px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.type, 0, 0);
    ctx.restore();
  }

  requestAnimationFrame(animate);
}
animate();

// 点击屏幕爆裂
document.body.addEventListener('click', function(e) {
  if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
  burstHearts(e.clientX, e.clientY);
});

// ====== 发送消息到 ntfy ======
function sendMessage(text) {
  if (!text || !text.trim()) return;
  if (!NTFY_URL) {                      // 没有 reply 参数 → 提示从通知进入
    document.getElementById('notice').style.display = 'flex';
    return;
  }
  fetch(NTFY_URL, {
    method: 'POST',
    body: text.trim(),
    headers: { 'Title': '💌 回复' }
  }).then(() => {
    showFeedback();
  }).catch(() => {
    showFeedback();
  });
}

function showFeedback() {
  const fb = document.getElementById('feedback');
  fb.classList.add('show');
  setTimeout(() => fb.classList.remove('show'), 2000);
}

// ====== 绑定快捷回复 ======
document.querySelectorAll('.reply-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    const msg = this.getAttribute('data-msg');
    sendMessage(msg);
    // 点击位置爆裂
    const rect = this.getBoundingClientRect();
    burstHearts(rect.left + rect.width / 2, rect.top);
  });
});

// ====== 自定义发送 ======
const input = document.getElementById('customInput');
const sendBtn = document.getElementById('sendBtn');

function doSend() {
  const text = input.value;
  if (text.trim()) {
    sendMessage(text);
    input.value = '';
    // 键盘收起
    input.blur();
  }
}

sendBtn.addEventListener('click', doSend);
input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); doSend(); }
});

// ====== 防止双指缩放 ======
document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
document.addEventListener('touchmove', function(e) {
  if (e.scale !== 1) e.preventDefault();
}, { passive: false });
</script>
</body>
</html>
